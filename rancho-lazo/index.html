<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Rancho Lazo — 3B Pot</title>
  <link rel="icon" type="image/png" href="/shared/assets/logo_3b.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Rye&family=Exo+2:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg" aria-hidden="true">
    <div class="bg__dust"></div>
    <div class="bg__glow bg__glow--a"></div>
    <div class="bg__glow bg__glow--b"></div>
    <div class="bg__vignette"></div>
    <div class="bg__noise"></div>
  </div>

  <div id="app" class="stage">
    <header class="topbar">
      <a class="topbar__back" id="menuBtn" href="/inicio/" data-inicio-link>← Juegos</a>
      <div class="topbar__meta">
        <span class="topbar__chip">Máq. <strong id="machineLabel">—</strong></span>
        <span class="topbar__chip topbar__chip--balance">Saldo <strong id="credits">$0</strong></span>
        <span class="topbar__chip">Apuesta <strong id="bet">$5</strong></span>
        <span class="topbar__chip topbar__chip--win">Premio <strong id="win">$0</strong></span>
      </div>
    </header>

    <h1 class="logo"><span class="logo__text">Rancho Lazo</span></h1>

    <div class="paytable">
      <span class="pay pig">Cerdo ×0.5</span>
      <span class="pay cow">Vaca ×1.5</span>
      <span class="pay bull">Toro ×8</span>
    </div>

    <div class="cabinet">
      <div class="cabinet__bezel">
        <div class="cabinet__frame" aria-hidden="true"></div>
        <canvas id="game" width="960" height="540" aria-label="Rancho Lazo"></canvas>
      </div>
      <div class="cabinet__base" aria-hidden="true"></div>
    </div>

    <div class="hud">
      <button type="button" id="betDown" class="hud__adj" aria-label="Bajar">−</button>
      <div class="hud__screen"><span id="betHud">$5</span></div>
      <button type="button" id="betUp" class="hud__adj" aria-label="Subir">+</button>
      <button type="button" id="actionBtn" class="spin-btn">LANZAR</button>
      <button type="button" id="muteBtn" class="hud__mute" aria-label="Silencio">🔊</button>
    </div>

    <p class="hint" id="hint">Saldo de máquina · MXN · Pulsa LANZAR</p>
  </div>

  <div class="overlay" id="overlay">
    <div class="panel">
      <h1 id="title">Rancho Lazo</h1>
      <p id="subtitle">
        Arcade de lazo estilo casino. Cerdo poco · Vaca más · Toro jackpot.
        Forcejea tocando rápido cuando atrapes.
      </p>
      <div class="panel-actions">
        <a class="btn-link" href="/inicio/" data-inicio-link>Volver a juegos</a>
        <button type="button" id="startBtn">Jugar</button>
      </div>
    </div>
  </div>

  <script src="/shared/machine-client.js"></script>
  <script src="/shared/player-auth.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js?v=casino1"></script>
</body>
</html>
