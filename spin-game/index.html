<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3B Pot — Ruleta de la Fortuna</title>
    <link rel="icon" type="image/png" href="/shared/assets/logo_3b.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Exo+2:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/spin.css?v=bets2">
</head>
<body>
    <div class="bg" aria-hidden="true">
        <div class="bg__photo"></div>
        <div class="bg__vignette"></div>
        <div class="bg__glow bg__glow--a"></div>
        <div class="bg__glow bg__glow--b"></div>
        <div class="bg__noise"></div>
    </div>

    <div class="stage">
        <header class="topbar">
            <a class="topbar__back" href="/inicio/">← Juegos</a>
            <div class="topbar__meta">
                <span class="topbar__chip">Máq. <strong id="machineNum">—</strong></span>
                <span class="topbar__chip">Giros <strong id="totalSpins">0</strong></span>
                <span class="topbar__chip topbar__chip--balance">Saldo <strong id="balance">$0</strong></span>
            </div>
        </header>

        <main class="machine">
            <h1 class="logo">
                <span class="logo__text">Ruleta de la Fortuna</span>
            </h1>

            <div class="machine__row">
                <div class="cabinet">
                    <div class="cabinet__perspective">
                        <div class="cabinet__bezel">
                            <div class="cabinet__inner">
                                <div class="wheel-stage">
                                    <div class="wheel-stage__glow"></div>
                                    <div class="wheel-frame">
                                        <div class="wheel-frame__ring wheel-frame__ring--outer"></div>
                                        <div class="wheel-frame__ring wheel-frame__ring--inner"></div>
                                        <div class="wheel-frame__lights" id="wheelLights"></div>
                                        <div class="wheel-pointer">
                                            <div class="wheel-pointer__body"></div>
                                            <div class="wheel-pointer__shine"></div>
                                        </div>
                                        <div class="wheel-wrap">
                                            <canvas id="wheel" width="480" height="480" aria-label="Ruleta de premios"></canvas>
                                            <button class="wheel-center" id="spinBtn" type="button">
                                                <span class="wheel-center__ring"></span>
                                                <span class="wheel-center__label">GIRAR</span>
                                                <span class="wheel-center__sub" id="spinBtnSub">$50</span>
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="cabinet__base" aria-hidden="true"></div>
                    </div>
                </div>

                <aside class="side">
                    <div class="result-box" id="lastResult">
                        <div class="result-box__empty">
                            <span>Gira para comenzar</span>
                        </div>
                    </div>
                    <div class="metrics">
                        <div class="metric">
                            <span class="metric__value" id="totalWins">0</span>
                            <span class="metric__label">Victorias</span>
                        </div>
                        <div class="metric">
                            <span class="metric__value" id="bestWin">—</span>
                            <span class="metric__label">Mejor</span>
                        </div>
                        <div class="metric">
                            <span class="metric__value" id="netProfit">$0</span>
                            <span class="metric__label">Neto</span>
                        </div>
                    </div>
                    <div class="history-panel">
                        <div class="history-panel__head">
                            <span>Historial</span>
                            <span id="historyCount">0</span>
                        </div>
                        <ul class="history" id="history">
                            <li class="history__empty">Sin jugadas</li>
                        </ul>
                    </div>
                </aside>
            </div>

            <div class="hud">
                <div class="bet-panel">
                    <div class="bet-panel__top">
                        <span class="bet-panel__label">Apuesta</span>
                        <div class="bet-panel__actions">
                            <button type="button" class="btn-ghost" id="halfBetBtn">½</button>
                            <button type="button" class="btn-ghost" id="doubleBetBtn">2×</button>
                            <button type="button" class="btn-ghost" id="maxBetBtn">MAX</button>
                        </div>
                    </div>
                    <div class="bet-chips" id="betChips">
                        <button type="button" class="bet-chip" data-bet="1"><span class="bet-chip__inner">1</span></button>
                        <button type="button" class="bet-chip" data-bet="5"><span class="bet-chip__inner">5</span></button>
                        <button type="button" class="bet-chip is-active" data-bet="10"><span class="bet-chip__inner">10</span></button>
                        <button type="button" class="bet-chip" data-bet="25"><span class="bet-chip__inner">25</span></button>
                        <button type="button" class="bet-chip" data-bet="50"><span class="bet-chip__inner">50</span></button>
                        <button type="button" class="bet-chip" data-bet="100"><span class="bet-chip__inner">100</span></button>
                    </div>
                    <div class="bet-custom">
                        <div class="input-group">
                            <label for="customBet">Otro monto</label>
                            <div class="input-group__field">
                                <span class="input-group__prefix">$</span>
                                <input type="number" id="customBet" min="1" max="500" step="1" placeholder="15">
                            </div>
                        </div>
                        <div class="bet-summary">
                            <span class="bet-summary__label">Activa</span>
                            <span class="bet-summary__value" id="currentBet">10</span>
                            <span class="bet-summary__potential">Máx <strong id="potentialWin">$200</strong></span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="paytable">
                <div class="segments-legend" id="legend"></div>
            </div>

            <button type="button" class="btn-reset" id="resetBtn">Reiniciar sesión</button>
        </main>
    </div>

    <canvas id="confetti" class="confetti-canvas" aria-hidden="true"></canvas>

    <div class="toast" id="toast" hidden>
        <span class="toast__icon" id="toastIcon"></span>
        <span class="toast__msg" id="toastMsg"></span>
    </div>

    <div class="modal" id="modal" hidden>
        <div class="modal__backdrop"></div>
        <div class="modal__content" id="modalContent">
            <div class="modal__glow"></div>
            <div class="modal__icon" id="modalIcon"></div>
            <h2 class="modal__title" id="modalTitle"></h2>
            <p class="modal__amount" id="modalAmount"></p>
            <p class="modal__text" id="modalText"></p>
            <button type="button" class="modal__btn" id="modalClose">Continuar</button>
        </div>
    </div>

    <script src="/shared/machine-client.js"></script>
    <script src="/shared/player-auth.js"></script>
    <script src="js/spin.js?v=bets2"></script>
</body>
</html>
